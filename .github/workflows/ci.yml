name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check src setup.py shim/gen_forwarders.py tests
      - run: ruff format --check src setup.py shim/gen_forwarders.py tests
      - run: pytest

  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
      - run: make -C shim
      - run: test -s shim/msi_shim32.dll
      - run: make -C hardware

  maschine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: make -C maschine CFLAGS="-O2 -Werror"
      - run: make -C maschine check
