name: release

on:
  push:
    tags: ["v*"]

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # checkout fetches the tag without its annotation, and --notes-from-tag
      # would then use the commit message instead of the release notes.
      - run: git fetch --force origin "$GITHUB_REF:$GITHUB_REF"
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}

  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # release.sh commits the PKGBUILD bump after the tag (a commit can't
      # hold its own hash), so the tagged PKGBUILD is still the previous
      # release's. Pin it here; the action regenerates .SRCINFO.
      - name: Pin PKGBUILD to this release
        run: |
          sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/; s/^pkgrel=.*/pkgrel=1/; s/^_commit=.*/_commit=$GITHUB_SHA/" \
              packaging/aur/PKGBUILD
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: ni-wine
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: Selim Bucher
          commit_email: me@selim.one
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "release ${{ github.ref_name }}"

  ppa:
    runs-on: ubuntu-latest
    env:
      SERIES: "noble resolute"
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dh-python \
              python3-all python3-setuptools pybuild-plugin-pyproject \
              gcc-mingw-w64-i686 dput

      - name: Import signing key
        run: |
          echo "${{ secrets.PPA_GPG_PRIVATE_KEY }}" | gpg --batch --import
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

      - name: Build, sign and upload one source package per series
        env:
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          set -eu
          umask 077
          printf '%s' "$PPA_GPG_PASSPHRASE" > /tmp/pw

          # Ask Launchpad whether it already has a version.  Pending counts:
          # a just-accepted upload sits in that state before publishing.
          in_ppa() {
            curl -fsS "https://api.launchpad.net/1.0/~selimbucher/+archive/ubuntu/ni-wine?ws.op=getPublishedSources&source_name=ni-wine&exact_match=true&version=$1" \
              | grep -q '"total_size": [1-9]'
          }

          base=$(head -1 debian/changelog)
          for s in $SERIES; do
            sed -i "1s/.*/$(printf '%s' "$base" | sed "s/~noble1) noble/~${s}1) ${s}/")/" debian/changelog
            # Skip series already in the PPA, so a failed upload can simply
            # be re-run (Launchpad rejects a version it already has).
            v=$(dpkg-parsechangelog -S Version)
            if in_ppa "$v"; then
              echo "$v is already in the PPA"
              git checkout -- debian/changelog
              continue
            fi
            debuild -S -us -uc
            changes=$(ls ../ni-wine_*~${s}1_source.changes)
            debsign -p'gpg --batch --pinentry-mode loopback --passphrase-file /tmp/pw' "$changes"

            # Launchpad's FTP endpoint intermittently answers "550 Requested
            # action not taken: internal server error" -- always at the
            # transfer, never in the build, lintian or signing steps, and
            # sometimes after it has already taken the upload (2.4.0's
            # resolute package reported 550 and published anyway).  So treat
            # a failure as "ask Launchpad what it actually has" before
            # retrying, and only give up once it has really not arrived.
            # -f because dput otherwise refuses a file it has a local
            # .upload record for; in_ppa above is what prevents a genuine
            # duplicate.
            for attempt in 1 2 3; do
              if dput -f ppa:selimbucher/ni-wine "$changes"; then
                break
              fi
              echo "upload of $v failed (attempt $attempt)"
              sleep 30
              if in_ppa "$v"; then
                echo "$v reached the PPA despite the error"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "giving up on $v after 3 attempts" >&2
                exit 1
              fi
            done
            git checkout -- debian/changelog
          done
          rm -f /tmp/pw

  copr:
    runs-on: ubuntu-latest
    steps:
      - name: Install copr-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y pipx
          pipx install copr-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Pin the package's committish to this tag and build it, so COPR ships
      # the exact released commit (not a moving branch HEAD).  The RPM version
      # comes from the spec; a later manual Rebuild also stays on this tag.
      - name: Build the tagged commit on COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          copr-cli edit-package-scm selimbucher/ni-wine \
            --name ni-wine \
            --clone-url https://github.com/selimbucher/native-instruments \
            --commit "$GITHUB_REF_NAME" \
            --spec packaging/fedora/ni-wine.spec \
            --type git --method rpkg --webhook-rebuild off
          copr-cli build-package selimbucher/ni-wine --name ni-wine
